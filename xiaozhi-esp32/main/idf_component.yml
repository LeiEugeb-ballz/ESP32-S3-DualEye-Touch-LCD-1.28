## IDF Component Manager Manifest File
## Trimmed for ESP32-S3-DualEye-Touch-LCD-1.28 single-board production
dependencies:
  ## Display drivers — GC9A01 is the only display IC on this board
  espressif/esp_lcd_gc9a01: ==2.0.1

  ## Touch driver — CST816S capacitive touch on both I2C buses
  espressif/esp_lcd_touch_cst816s: ^1

  ## WiFi connection manager
  78/esp-wifi-connect: ~3.1.3

  ## Audio codec support
  espressif/esp_audio_effects: ~1.2.1
  espressif/esp_audio_codec: ~2.4.1
  espressif/esp_codec_dev: ~1.5.6

  ## Speech recognition (AFE + wake word)
  espressif/esp-sr: ~2.3.0

  ## UI framework
  lvgl/lvgl: ~9.5.0
  esp_lvgl_port: ~2.7.2

  ## Fonts
  78/xiaozhi-fonts: ~1.6.0

  ## Input devices
  espressif/button: ~4.1.5
  espressif/knob: ^1.0.0

  ## Camera support (ESP32-S3 native)
  espressif/esp32-camera:
    version: ^2.1.6
    rules:
    - if: target in [esp32s3]
  espressif/esp_video:
    version: ==1.3.1
    rules:
    - if: target in [esp32s3]

  ## Image processing
  espressif/esp_image_effects:
    version: ^1.0.1
    rules:
    - if: target not in [esp32]
  espressif/esp_new_jpeg: ^0.6.1

  ## Assets management
  espressif/esp_mmap_assets: ^1.3.2

  ## LED control
  espressif/led_strip: ~3.0.2

  ## USB RNDIS networking
  espressif/iot_usbh_rndis:
    version: ^0.3.1
    rules:
    - if: target in [esp32s3]

  ## Battery estimation
  espressif/adc_battery_estimation: ^0.2.1

  ## Required IDF version
  idf:
    version: '>=5.5.2'
